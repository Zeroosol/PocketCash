# Builds PocketCash for iPhone with Xcode on a GitHub-hosted Mac, runs the tests, and uploads to App Store Connect
# (TestFlight). Run it from the Actions tab ("Run workflow"), or push a tag like ios-v1.0.0. Setup: docs/release-ios.md.
# Adapted from Splitty's TestFlight workflow.
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (otherwise just build and test)
        type: boolean
        default: true
  push:
    tags: ['ios-v*']
  pull_request:
    paths:
      - 'ios/**'
      - 'spec/**'
      - 'tools/check_ios_strings.js'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Needs Xcode 26 or newer. If macos-latest is older, set the repository variable MAC_RUNNER (e.g. macos-26).
    runs-on: ${{ vars.MAC_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      UPLOAD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated presets are up to date
        working-directory: .
        run: node tools/build_presets.js --check

      - name: Check every language has every string
        working-directory: .
        run: node tools/check_ios_strings.js --check

      - name: Use the newest release Xcode on the runner
        run: |
          # App Store Connect rejects builds from beta and release-candidate Xcodes, so skip those.
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.?candidate' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Testing on simulator $SIM"
          xcodebuild test -quiet -project PocketCash.xcodeproj -scheme PocketCash -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO

      - name: Check the secrets are set
        if: env.UPLOAD == 'true'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_API_KEY"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/release-ios.md."
            exit 1
          fi

      - name: Write the App Store Connect key
        if: env.UPLOAD == 'true'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          # Every upload needs a higher build number than the last; the run number only ever goes up.
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Archive
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Automatic signing with the API key: Xcode creates the certificate and profiles itself, including the
          # App Group for the app and the widget extension.
          xcodebuild archive -quiet \
            -project PocketCash.xcodeproj -scheme PocketCash -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketCash.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Check the app's settings before uploading
        if: env.UPLOAD == 'true'
        run: |
          PLIST="$RUNNER_TEMP/PocketCash.xcarchive/Products/Applications/PocketCash.app/Info.plist"
          FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$PLIST" | tr -d ' \n')
          ENCRYPTION=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST" 2>/dev/null || echo missing)
          echo "UIDeviceFamily: $FAMILY (1 = iPhone)"
          echo "ITSAppUsesNonExemptEncryption: $ENCRYPTION"
          if [ ! -d "$RUNNER_TEMP/PocketCash.xcarchive/Products/Applications/PocketCash.app/PlugIns/PocketCashWidget.appex" ]; then
            echo "::error::The widget extension is missing from the archive."
            exit 1
          fi
          if echo "$FAMILY" | grep -q 2; then echo "::error::The app claims iPad support; every target needs TARGETED_DEVICE_FAMILY \"1\"."; exit 1; fi
          if [ "$ENCRYPTION" != "false" ]; then echo "::error::ITSAppUsesNonExemptEncryption should be false."; exit 1; fi

      - name: Upload to App Store Connect
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PocketCash.xcarchive" \
            -exportOptionsPlist ../ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          {
            echo "### Uploaded PocketCash (build $BUILD_NUMBER)"
            echo "It appears in App Store Connect → TestFlight after Apple finishes processing, usually 5–30 minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
